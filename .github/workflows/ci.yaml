# ============================================================================
# Sentinel Platform - CI/CD Pipeline
# ============================================================================
#
# This workflow runs on push/PR to main branch and includes:
# - Code quality checks (linting, type checking)
# - Unit tests with coverage
# - Security scanning (pip-audit, bandit, trivy)
# - Docker image build (on main only)
#
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sentinel-api

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Code Quality - Linting
  # ==========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.2.1 mypy==1.8.0

      - name: Run Ruff linter
        run: |
          ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: |
          ruff format --check .

      - name: Install type checking dependencies
        run: |
          pip install -r requirements.txt
          pip install types-PyYAML types-python-jose

      - name: Run MyPy type checker
        run: |
          mypy api/ ml/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true  # Type errors are warnings for now

  # ==========================================================================
  # Unit Tests
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=api \
            --cov=ml \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-sentinel
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ==========================================================================
  # Kubernetes Manifests
  # ==========================================================================
  # This job exists because of a bug that lived in the repository for months.
  # The training CronJob invoked `python -m sentinel.training.cli train
  # --config /config/training-config.yaml`: a module that has never existed
  # here, pointed at a config file no code path reads. Every other job passed
  # the whole time. Linting checks Python that is imported, tests check Python
  # that is called, and a container command is neither until a pod starts — so
  # the only thing that would ever have caught it is a job like this one.
  manifests:
    name: K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.1'  # matches the kustomize version used locally

      # -----------------------------------------------------------------------
      # Render. Blocking: a manifest that does not build cannot be deployed.
      # -----------------------------------------------------------------------
      - name: Render every kustomize target
        run: |
          set -euo pipefail
          mkdir -p rendered
          for target in base overlays/dev overlays/prod; do
            name="${target//\//-}"
            echo "::group::kubectl kustomize k8s/${target}"
            kubectl kustomize "k8s/${target}" | tee "rendered/${name}.yaml"
            echo "::endgroup::"
          done

      # -----------------------------------------------------------------------
      # Schema validation. Catches what kustomize happily renders and the API
      # server later rejects: a misspelled field, a bad apiVersion, a string
      # where an integer belongs. `-strict` also rejects unknown properties,
      # which is what makes a typo like `readOnlyRootFilesytem` fail here
      # instead of silently disabling the setting in production.
      # -----------------------------------------------------------------------
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          url="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "$url" -o kubeconform.tar.gz
          # Pinned by digest, not just by tag: a release asset can be replaced.
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -v

      - name: Validate manifests against the Kubernetes schemas
        run: |
          set -euo pipefail
          for f in rendered/*.yaml; do
            echo "::group::kubeconform ${f}"
            ./kubeconform -strict -summary -kubernetes-version 1.31.0 "$f"
            echo "::endgroup::"
          done

      # -----------------------------------------------------------------------
      # The root-cause guard. Everything above would have passed happily with
      # `python -m sentinel.training.cli` in the manifest: it is well-formed
      # YAML and a valid CronJob. This step resolves the module.
      #
      # requirements.txt is installed because resolving `ml.training.train`
      # imports its parent package, which imports mlflow. The script tells the
      # two failure modes apart and exits 2 (not 1) if a dependency is what is
      # missing, so a broken environment never masquerades as a broken
      # manifest.
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check that every container command resolves
        run: |
          set -euo pipefail
          for f in rendered/*.yaml; do
            echo "::group::commands in ${f}"
            python scripts/check_manifest_commands.py "$f"
            echo "::endgroup::"
          done

  # ==========================================================================
  # Security Scanning
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      # -----------------------------------------------------------------------
      # Dependency vulnerability scanning
      # -----------------------------------------------------------------------
      - name: Run pip-audit
        run: |
          pip-audit --strict --desc on || true
        continue-on-error: true  # Don't fail on vulnerabilities, just report

      # -----------------------------------------------------------------------
      # Static security analysis
      # -----------------------------------------------------------------------
      - name: Run Bandit security linter
        run: |
          bandit -r api/ ml/ -f json -o bandit-report.json || true
          bandit -r api/ ml/ -f txt || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7
        if: always()

      # -----------------------------------------------------------------------
      # Semgrep SAST (using official action)
      # -----------------------------------------------------------------------
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        continue-on-error: true

  # ==========================================================================
  # Docker Build
  # ==========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    # `manifests` gates the build too: there is no point publishing an image
    # that the deployment manifests cannot correctly run.
    needs: [test, manifests, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # -----------------------------------------------------------------------
      # Trivy vulnerability scan on Dockerfile
      # -----------------------------------------------------------------------
      - name: Run Trivy vulnerability scanner (config)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'api/Dockerfile'
          format: 'table'
          exit-code: '0'  # Don't fail on findings

      # -----------------------------------------------------------------------
      # Build and push Docker image
      # -----------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # -----------------------------------------------------------------------
      # Trivy vulnerability scan on built image
      # -----------------------------------------------------------------------
      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()

  # ==========================================================================
  # Integration Tests (Optional - runs on main only)
  # ==========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short || true
        continue-on-error: true
        env:
          TEST_ENV: ci

  # ==========================================================================
  # Notification (on failure)
  # ==========================================================================
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, test, manifests, security, build]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send notification
        run: |
          echo "CI pipeline failed for ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          # Add Slack/Discord/Email notification here if needed
