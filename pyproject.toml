# ============================================================================
# Sentinel Platform - Project Configuration
# ============================================================================

[project]
name = "sentinel-platform"
version = "1.0.0"
description = "Cloud-native intrusion detection platform powered by ML"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sentinel Team"}
]
keywords = ["security", "intrusion-detection", "machine-learning", "cloud-native"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/sentinel-platform/sentinel"
Documentation = "https://sentinel-platform.readthedocs.io"
Repository = "https://github.com/sentinel-platform/sentinel"

# ============================================================================
# Build System
# ============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "ml*", "data*"]

# ============================================================================
# Ruff Configuration
# ============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "*.egg-info",
    "build",
    "dist",
    # One-shot academic script archived verbatim from the CICIDS2017 TFA.
    # Kept unmodified as a historical artifact; not part of the codebase.
    "docs/ml/presentacion/generar_presentacion.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (needed for FastAPI Depends)
    "B904",   # raise without from (sometimes intentional)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "ARG001", # unused function argument (common in FastAPI)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004", "S101"]
"**/__init__.py" = ["F401"]
# Frozen academic artifact ported verbatim from the CICIDS2017 TFA. Its
# training loop is one long function by design: warmup, balanced batching,
# focal weighting, early stopping and LR scheduling are all interleaved.
# Splitting it up would be a rewrite of code whose value is that it is
# unchanged and its measured numbers still hold.
"ml/flow/models/neural_network.py" = ["PLR0912", "PLR0915", "C901"]
# Figure generation: long dispatch chains with no branching logic worth
# extracting.
"ml/evaluation/plots.py" = ["PLR0912", "PLR0915", "C901"]
# Training entry points: `main` is a linear script — load, split, train,
# evaluate, save, report — and every branch is an explicit CLI option. Cutting
# it into pieces would hide the order the run happens in, which is the one
# thing a reader of a training script needs.
"ml/training/train_cicids.py" = ["PLR0912", "PLR0915", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["api", "ml", "data"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# MyPy Configuration
# ============================================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "xgboost.*",
    "matplotlib.*",
    "seaborn.*",
    "mlflow.*",
    "prometheus_client.*",
    "structlog.*",
    "slowapi.*",
    "jose.*",
    "passlib.*",
]
ignore_missing_imports = true

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source = ["api", "ml"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "ml/training/train.py",  # Training code tested via integration/manual validation
    # Same rationale for the flow track's CLI: exercised end to end by a @slow
    # CliRunner smoke plus the CLI→serving roundtrip, not by line coverage.
    "ml/training/train_cicids.py",
    # Figure generation: no logic worth asserting on, and importing it would
    # drag matplotlib/seaborn into every coverage run. Validated by eye.
    "ml/evaluation/plots.py",
    # Experimental branch of the flow track, kept for its academic value and
    # excluded from serving: F1-macro 0.7508 against 0.9516 for the XGBoost
    # cascade. Covered by @slow smoke tests, not by line coverage.
    "ml/flow/models/neural_network.py",
    "ml/flow/pipelines/cascade_mlp.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
show_missing = true
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# Bandit Configuration
# ============================================================================

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B104"]  # Skip assert and bind to all interfaces warnings

# ============================================================================
# Black Configuration (if used alongside Ruff)
# ============================================================================

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
