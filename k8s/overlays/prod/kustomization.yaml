apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level `namespace:` — see the long note in the dev overlay. In short:
# setting it broke the render outright (the three Namespace objects from
# `base/namespaces/` all collapsed onto `platform`), and had it worked it would
# have dragged the `ml` namespace's CronJobs, PVCs, RBAC and NetworkPolicies
# into `platform`. Every base resource declares its own namespace already.

resources:
  - ../../base

commonLabels:
  environment: prod

# Image configuration for prod
# Note: Update PROJECT_ID with your actual GCP project ID
images:
  - name: sentinel-api
    newName: gcr.io/PROJECT_ID/sentinel-api  # TODO: Replace PROJECT_ID
    # Use specific version tags in production, not 'latest'
    newTag: v1.0.0

# Patches for prod environment
patches:
  # Increase replicas for prod
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sentinel-api
        namespace: platform
      spec:
        replicas: 3
  # Higher HPA for prod
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: sentinel-api
        namespace: platform
      spec:
        minReplicas: 3
        maxReplicas: 20
  # Production resources
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sentinel-api
        namespace: platform
      spec:
        template:
          spec:
            containers:
              - name: sentinel-api
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    cpu: "1"
                    memory: 1Gi
                # Reference secrets from ESO (sentinel-secrets)
                env:
                  - name: JWT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: sentinel-secrets
                        key: jwt-secret
                  - name: API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: sentinel-secrets
                        key: api-key
  # Higher PDB for prod
  - patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: sentinel-api
        namespace: platform
      spec:
        minAvailable: 2
  # Update ServiceAccount annotation for prod
  # Note: Update PROJECT_ID with your actual GCP project ID
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: sentinel-api
        namespace: platform
        annotations:
          iam.gke.io/gcp-service-account: sentinel-api-prod@PROJECT_ID.iam.gserviceaccount.com

# ConfigMap patches for prod
# Note: Update PROJECT_ID with your actual GCP project ID
configMapGenerator:
  - name: sentinel-api-config
    namespace: platform
    behavior: merge
    literals:
      - ENVIRONMENT=prod
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - MODELS_BUCKET=sentinel-models-prod-PROJECT_ID  # TODO: Replace PROJECT_ID
      - MODELS_PATH=gs://sentinel-models-prod-PROJECT_ID/  # TODO: Replace PROJECT_ID
      - ENABLE_METRICS=true
      - WORKERS=4

# Secrets are managed by External Secrets Operator (ESO)
# ESO creates 'sentinel-secrets' in this namespace from GCP Secret Manager
# See k8s/base/external-secrets/README.md for details
