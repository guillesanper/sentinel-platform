# Additional deployment patches for prod environment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  namespace: platform
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        # Production annotations
        sentinel.io/environment: "production"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      # Ensure pods spread across zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sentinel-api
      # Pod anti-affinity for HA
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: sentinel-api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: sentinel-api
          # Stricter probes for production
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
