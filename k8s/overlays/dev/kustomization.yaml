apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform

resources:
  - ../../base

commonLabels:
  environment: dev

# Image configuration for dev
# Note: Update PROJECT_ID with your actual GCP project ID
images:
  - name: sentinel-api
    newName: gcr.io/PROJECT_ID/sentinel-api  # TODO: Replace PROJECT_ID
    newTag: dev-latest

# Patches for dev environment
patches:
  # Reduce replicas for dev
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sentinel-api
        namespace: platform
      spec:
        replicas: 1
  # Reduce HPA for dev
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: sentinel-api
        namespace: platform
      spec:
        minReplicas: 1
        maxReplicas: 3
  # Lower resources for dev
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sentinel-api
        namespace: platform
      spec:
        template:
          spec:
            containers:
              - name: sentinel-api
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi
                # Reference secrets from ESO (sentinel-secrets)
                env:
                  - name: JWT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: sentinel-secrets
                        key: jwt-secret
                  - name: API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: sentinel-secrets
                        key: api-key

# ConfigMap patches for dev
# Note: Update PROJECT_ID with your actual GCP project ID
configMapGenerator:
  - name: sentinel-api-config
    namespace: platform
    behavior: merge
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=DEBUG
      - MODELS_BUCKET=sentinel-models-dev-PROJECT_ID  # TODO: Replace PROJECT_ID
      - MODELS_PATH=gs://sentinel-models-dev-PROJECT_ID/  # TODO: Replace PROJECT_ID
      - ENABLE_METRICS=true
      - WORKERS=1

# Secrets are managed by External Secrets Operator (ESO)
# ESO creates 'sentinel-secrets' in this namespace from GCP Secret Manager
# See k8s/base/external-secrets/README.md for details
