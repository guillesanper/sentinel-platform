apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# There is deliberately no top-level `namespace:` here.
#
# This overlay used to set `namespace: platform`, which made it fail to render
# at all: kustomize's namespace transformer rewrites Namespace objects too, so
# the three namespaces from `base/namespaces/` all became `platform` and
# collided ("namespace transformation produces ID conflict").
#
# Deleting the line rather than working around the collision is the correct fix
# twice over. The base is a two-namespace deployment — the API in `platform`,
# the training CronJobs, PVCs, Roles and NetworkPolicies in `ml` — and every
# single base resource already declares its own `metadata.namespace`. Forcing
# `platform` on all of them would have moved the entire ML side out of its
# namespace, away from the `sentinel-ml` ServiceAccount and the NetworkPolicies
# written for it. The render error was hiding a worse bug than itself.
#
# The patches below still carry `namespace: platform` in their own metadata,
# which is what makes them match their targets.

resources:
  - ../../base

commonLabels:
  environment: dev

# Image configuration for dev
# Note: Update PROJECT_ID with your actual GCP project ID
images:
  - name: sentinel-api
    newName: gcr.io/PROJECT_ID/sentinel-api  # TODO: Replace PROJECT_ID
    newTag: dev-latest

# Patches for dev environment
patches:
  # Reduce replicas for dev
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sentinel-api
        namespace: platform
      spec:
        replicas: 1
  # Reduce HPA for dev
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: sentinel-api
        namespace: platform
      spec:
        minReplicas: 1
        maxReplicas: 3
  # Lower resources for dev
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sentinel-api
        namespace: platform
      spec:
        template:
          spec:
            containers:
              - name: sentinel-api
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi
                # Reference secrets from ESO (sentinel-secrets)
                env:
                  - name: JWT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: sentinel-secrets
                        key: jwt-secret
                  - name: API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: sentinel-secrets
                        key: api-key

# ConfigMap patches for dev
# Note: Update PROJECT_ID with your actual GCP project ID
configMapGenerator:
  - name: sentinel-api-config
    namespace: platform
    behavior: merge
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=DEBUG
      - MODELS_BUCKET=sentinel-models-dev-PROJECT_ID  # TODO: Replace PROJECT_ID
      - MODELS_PATH=gs://sentinel-models-dev-PROJECT_ID/  # TODO: Replace PROJECT_ID
      - ENABLE_METRICS=true
      - WORKERS=1

# Secrets are managed by External Secrets Operator (ESO)
# ESO creates 'sentinel-secrets' in this namespace from GCP Secret Manager
# See k8s/base/external-secrets/README.md for details
