apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-api-config
  namespace: platform
  labels:
    app.kubernetes.io/name: sentinel-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
data:
  ENVIRONMENT: "dev"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  MODELS_BUCKET: "sentinel-models-dev-PROJECT_ID"
  MODELS_PATH: "gs://sentinel-models-dev-PROJECT_ID/"
  ENABLE_METRICS: "true"
  WORKERS: "2"
  HOST: "0.0.0.0"
  PORT: "8000"
