apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-api
  namespace: platform
  labels:
    app.kubernetes.io/name: sentinel-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
spec:
