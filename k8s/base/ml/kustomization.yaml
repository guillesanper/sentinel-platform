apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ml

commonLabels:
  app.kubernetes.io/part-of: sentinel
  app.kubernetes.io/managed-by: kustomize

resources:
  # Storage first: both CronJobs below are unschedulable without their claims.
  - models-pvc.yaml
  - cicids-data-pvc.yaml
  # Event track (log events, 17 features) — active.
  - training-job.yaml
  # Flow track (CICIDS2017, 78 features) — suspended until the data volume is
  # populated. See the header of the file.
  - flow-training-job.yaml
