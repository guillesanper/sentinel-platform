---
# ============================================================================
# CICIDS2017 capture files for the flow-track CronJob
# ============================================================================
# The flow track trains on the eight `MachineLearningCVE` CSVs of CICIDS2017 —
# 844 MB that are deliberately NOT in the container image: `.dockerignore`
# excludes `**/*.csv` precisely so a security product does not ship a dataset.
# The files therefore have to reach the cluster through a volume.
#
# This claim is what `sentinel-flow-training` mounts read-only at
# `/data/cicids`. It starts EMPTY, which is why that CronJob ships with
# `suspend: true`: a job that reads an empty directory is the same class of
# defect as a job that invokes a module that does not exist.
#
# To populate it (once, from a machine that has the CSVs — e.g. `api/csvs/`):
#
#   kubectl -n ml apply -f k8s/base/ml/cicids-data-pvc.yaml
#   kubectl -n ml run cicids-loader --image=busybox:1.36 --restart=Never \
#     --overrides='{"spec":{"containers":[{"name":"cicids-loader","image":"busybox:1.36",
#       "command":["sleep","3600"],"volumeMounts":[{"name":"data","mountPath":"/data/cicids"}]}],
#       "volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"sentinel-cicids-data"}}]}}'
#   kubectl -n ml cp api/csvs/. cicids-loader:/data/cicids/
#   kubectl -n ml delete pod cicids-loader
#   kubectl -n ml patch cronjob sentinel-flow-training -p '{"spec":{"suspend":false}}'
#
# 2Gi covers the 844 MB with room for the filesystem overhead and a partial
# re-upload. Read-only for the job, so no growth from the training side.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinel-cicids-data
  namespace: ml
  labels:
    app.kubernetes.io/name: sentinel-cicids-data
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # storageClassName is deliberately unset so the cluster default applies.
