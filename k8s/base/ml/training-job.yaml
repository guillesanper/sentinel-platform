---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sentinel-training
  namespace: ml
  labels:
    app.kubernetes.io/name: sentinel-training
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "0 2 * * 0"  # Weekly on Sunday at 2 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2 hours max
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sentinel-training
            app.kubernetes.io/component: ml
            app.kubernetes.io/part-of: sentinel
        spec:
          serviceAccountName: sentinel-ml
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: training
              image: sentinel-api:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - sentinel.training.cli
              args:
                - train
                - --config
                - /config/training-config.yaml
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: ENVIRONMENT
                  valueFrom:
                    configMapKeyRef:
                      name: sentinel-ml-config
                      key: ENVIRONMENT
                - name: MODELS_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: sentinel-ml-config
                      key: MODELS_BUCKET
                - name: MLFLOW_TRACKING_URI
                  valueFrom:
                    configMapKeyRef:
                      name: sentinel-ml-config
                      key: MLFLOW_TRACKING_URI
                - name: DATA_PATH
                  valueFrom:
                    configMapKeyRef:
                      name: sentinel-ml-config
                      key: DATA_PATH
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: cache
                  mountPath: /home/appuser/.cache
          volumes:
            - name: tmp
              emptyDir: {}
            - name: cache
              emptyDir: {}
            - name: config
              configMap:
                name: sentinel-training-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-ml-config
  namespace: ml
  labels:
    app.kubernetes.io/name: sentinel-training
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
data:
  ENVIRONMENT: "dev"
  MODELS_BUCKET: "sentinel-models-dev-PROJECT_ID"
  MLFLOW_TRACKING_URI: "http://mlflow.ml.svc.cluster.local:5000"
  DATA_PATH: "gs://sentinel-data-dev-PROJECT_ID/training/"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-training-config
  namespace: ml
  labels:
    app.kubernetes.io/name: sentinel-training
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
data:
  training-config.yaml: |
    # Sentinel ML Training Configuration
    training:
      batch_size: 1024
      epochs: 100
      early_stopping_patience: 10
      validation_split: 0.2

    models:
      anomaly_detector:
        type: isolation_forest
        contamination: 0.1
        n_estimators: 100
        max_samples: "auto"

      attack_classifier:
        type: xgboost
        n_estimators: 100
        max_depth: 6
        learning_rate: 0.1
        objective: "multi:softprob"

    features:
      n_features: 17
      normalize: true

    output:
      model_path: "models/"
      metrics_path: "metrics/"
