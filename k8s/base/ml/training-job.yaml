---
# ============================================================================
# Event track — weekly retrain
# ============================================================================
# Trains the log-event cascade (`AnomalyDetector` + `AttackClassifier`) and
# writes the artifacts to the `sentinel-models` PVC.
#
# `command`/`args` are the real click interface of `ml.training.train`, not a
# paraphrase of it. The previous version invoked `python -m
# sentinel.training.cli train --config /config/training-config.yaml`: a module
# that has never existed in this repository, pointed at a config file that no
# code path reads. Nothing caught it because nothing in CI runs the manifest's
# command. If you change these flags, run them: `python -m ml.training.train
# --help`.
#
# NOTE ON SERVING: this job produces artifacts, it does not publish them. The
# API Deployment (`k8s/base/platform/deployment.yaml`) mounts no model volume,
# so a cluster API pod starts with untrained models on the event track and
# answers 503 on the flow endpoints. Making these artifacts servable requires a
# transfer step, because `sentinel-models` lives in namespace `ml` and the API
# lives in namespace `platform` — PVCs do not cross namespaces. The options, in
# order of intrusiveness: (a) an object-store round trip (upload here, download
# in an init container — `MODELS_BUCKET` exists for exactly this and is not yet
# wired up on either side), (b) a ReadWriteMany volume backed by a filesystem
# CSI driver, exposed as a second PVC bound to the same PV, or (c) baking the
# artifacts into the image at build time. This is a precondition for the flow
# endpoints in cluster, not a regression: the event track has always been in
# this state.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sentinel-training
  namespace: ml
  labels:
    app.kubernetes.io/name: sentinel-training
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "0 2 * * 0"  # Weekly on Sunday at 2 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2 hours max
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sentinel-training
            app.kubernetes.io/component: ml
            app.kubernetes.io/part-of: sentinel
        spec:
          serviceAccountName: sentinel-ml
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: training
              image: sentinel-api:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - ml.training.train
              args:
                # Synthetic generator. `--data-path` / `--csv-path` are the
                # alternatives, and both need a corpus that is not in the
                # cluster today; 60k events leaves a validation split large
                # enough for the threshold search to mean anything.
                - --n-samples
                - "60000"
                - --attack-ratio
                - "0.2"
                # F-beta with beta=2 weights recall over precision: a missed
                # intrusion costs more than an analyst dismissing a false
                # positive. Writes the operating point into
                # `training_summary.json`.
                - --threshold-strategy
                - fbeta
                - --beta
                - "2.0"
                # The PVC, mounted below. Matches the image's MODELS_PATH and
                # the relative default the model classes resolve from /app.
                - --output-dir
                - /app/models
                # MLFLOW_TRACKING_URI below points at a Service that this
                # repository does not deploy, and `log_to_mlflow` has no
                # fallback — enabling tracking here would fail the job every
                # Sunday after the models were already saved. Drop this flag
                # once an MLflow server exists in the `ml` namespace.
                - --no-mlflow
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: ENVIRONMENT
                  valueFrom:
                    configMapKeyRef:
                      name: sentinel-ml-config
                      key: ENVIRONMENT
                # Read by the mlflow client library itself, not by our code, so
                # it is kept even though `--no-mlflow` makes it inert today: it
                # is what makes removing that flag a one-line change.
                - name: MLFLOW_TRACKING_URI
                  valueFrom:
                    configMapKeyRef:
                      name: sentinel-ml-config
                      key: MLFLOW_TRACKING_URI
                # MODELS_BUCKET and DATA_PATH used to be injected here too.
                # Neither is read by anything: `ml.training.train` is entirely
                # click-driven and has no object-store code path. DATA_PATH was
                # the more misleading of the two — a `gs://` URL suggesting the
                # job trains on captured data when it trains on the synthetic
                # generator. They stay in the ConfigMap below, ready for the
                # day the code reads them.
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: models
                  mountPath: /app/models
                # $HOME in this image is /home/sentinel: the Dockerfile creates
                # the `sentinel` user with --create-home. The mount used to
                # point at /home/appuser/.cache, a path no process ever writes
                # to, which left the real cache directory on the read-only
                # root filesystem.
                - name: cache
                  mountPath: /home/sentinel/.cache
          volumes:
            - name: tmp
              emptyDir: {}
            - name: cache
              emptyDir: {}
            - name: models
              persistentVolumeClaim:
                claimName: sentinel-models
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-ml-config
  namespace: ml
  labels:
    app.kubernetes.io/name: sentinel-training
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
data:
  ENVIRONMENT: "dev"
  MODELS_BUCKET: "sentinel-models-${ENVIRONMENT}-${PROJECT_ID}"
  MLFLOW_TRACKING_URI: "http://mlflow.ml.svc.cluster.local:5000"
  DATA_PATH: "gs://sentinel-data-${ENVIRONMENT}-${PROJECT_ID}/training/"
# The `sentinel-training-config` ConfigMap that used to follow here is gone,
# along with the /config mount that carried it. It described a training run
# nobody performs: `batch_size`, `epochs` and `early_stopping_patience` for
# models that are an IsolationForest and an XGBoost classifier, and
# `features.n_features` for a count the code derives from `FeatureExtractor`
# rather than reads. `ml/training/train.py` is 100% click and never opened the
# file, so the wrong numbers were invisible. Every value that actually steers a
# run is now an explicit flag in `args` above.
