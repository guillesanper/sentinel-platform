---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-api
  namespace: platform
  labels:
    app.kubernetes.io/name: sentinel-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
  annotations:
    iam.gke.io/gcp-service-account: sentinel-api-dev@PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-ml
  namespace: ml
  labels:
    app.kubernetes.io/name: sentinel-ml
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
  annotations:
    iam.gke.io/gcp-service-account: sentinel-ml-dev@PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: true
