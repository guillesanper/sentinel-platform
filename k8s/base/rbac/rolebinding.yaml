---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinel-api-rolebinding
  namespace: platform
  labels:
    app.kubernetes.io/name: sentinel-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinel-api-role
subjects:
  - kind: ServiceAccount
    name: sentinel-api
    namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinel-ml-rolebinding
  namespace: ml
  labels:
    app.kubernetes.io/name: sentinel-ml
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinel-ml-role
subjects:
  - kind: ServiceAccount
    name: sentinel-ml
    namespace: ml
