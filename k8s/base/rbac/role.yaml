---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinel-api-role
  namespace: platform
  labels:
    app.kubernetes.io/name: sentinel-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinel-ml-role
  namespace: ml
  labels:
    app.kubernetes.io/name: sentinel-ml
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
