---
# Alertmanager Operator Custom Resource
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: alertmanager-main
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 3
  version: v0.26.0
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: standard-rwo
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-main
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: sentinel
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9093
      targetPort: 9093
    - name: mesh
      port: 9094
      targetPort: 9094
  selector:
    app.kubernetes.io/name: alertmanager
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: sentinel
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      # Slack webhook URL (configure via external secrets in production)
      # slack_api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
      # SMTP configuration for email notifications
      # smtp_smarthost: 'smtp.gmail.com:587'
      # smtp_from: 'alertmanager@example.com'
      # smtp_auth_username: 'alertmanager@example.com'
      # smtp_auth_password: 'password'

    # Route tree
    route:
      group_by: ['alertname', 'severity', 'team']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
      routes:
        # Critical alerts go to PagerDuty and Slack
        - match:
            severity: critical
          receiver: 'critical-receiver'
          continue: true
          routes:
            # Security-specific critical alerts
            - match:
                team: security
              receiver: 'security-critical-receiver'
              continue: true

        # Warning alerts go to Slack only
        - match:
            severity: warning
          receiver: 'warning-receiver'
          group_wait: 1m
          repeat_interval: 12h

        # Security team alerts
        - match:
            team: security
          receiver: 'security-receiver'
          group_by: ['alertname', 'attack_type']

        # ML team alerts
        - match:
            team: ml
          receiver: 'ml-receiver'

        # Platform team alerts
        - match:
            team: platform
          receiver: 'platform-receiver'

    # Inhibition rules
    inhibit_rules:
      # If a critical alert is firing, inhibit warning alerts for the same service
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'service']

      # If NoReplicasAvailable is firing, inhibit PodNotReady
      - source_match:
          alertname: 'SentinelNoReplicasAvailable'
        target_match:
          alertname: 'SentinelPodNotReady'
        equal: ['namespace']

      # If the API is down, inhibit latency/error alerts
      - source_match:
          alertname: 'SentinelModelNotReady'
        target_match_re:
          alertname: 'SentinelHigh(Latency|ErrorRate)'
        equal: ['service']

    # Receivers
    receivers:
      - name: 'default-receiver'
        # Configure webhook for default alerts
        webhook_configs:
          - url: 'http://alertmanager-webhook.observability.svc.cluster.local:8080/webhook'
            send_resolved: true

      - name: 'critical-receiver'
        # PagerDuty for critical alerts (configure service key via external secrets)
        # pagerduty_configs:
        #   - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
        #     severity: 'critical'
        #     description: '{{ .CommonAnnotations.summary }}'
        #     details:
        #       firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
        #       resolved: '{{ template "pagerduty.default.instances" .Alerts.Resolved }}'
        webhook_configs:
          - url: 'http://alertmanager-webhook.observability.svc.cluster.local:8080/critical'
            send_resolved: true

      - name: 'warning-receiver'
        # Slack for warning alerts
        # slack_configs:
        #   - channel: '#sentinel-alerts'
        #     send_resolved: true
        #     title: '{{ .Status | toUpper }}{{ if eq .Status "firing" }} ({{ .Alerts.Firing | len }}){{ end }}'
        #     text: '{{ range .Alerts }}*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n{{ end }}'
        webhook_configs:
          - url: 'http://alertmanager-webhook.observability.svc.cluster.local:8080/warning'
            send_resolved: true

      - name: 'security-receiver'
        # Security team Slack channel
        # slack_configs:
        #   - channel: '#security-alerts'
        #     send_resolved: true
        #     color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        #     title: 'Security Alert: {{ .CommonLabels.alertname }}'
        #     text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
        webhook_configs:
          - url: 'http://alertmanager-webhook.observability.svc.cluster.local:8080/security'
            send_resolved: true

      - name: 'security-critical-receiver'
        # Critical security alerts - immediate action required
        # pagerduty_configs:
        #   - service_key: 'YOUR_SECURITY_PAGERDUTY_KEY'
        #     severity: 'critical'
        webhook_configs:
          - url: 'http://alertmanager-webhook.observability.svc.cluster.local:8080/security-critical'
            send_resolved: true

      - name: 'ml-receiver'
        # ML team notifications
        # slack_configs:
        #   - channel: '#ml-alerts'
        #     send_resolved: true
        webhook_configs:
          - url: 'http://alertmanager-webhook.observability.svc.cluster.local:8080/ml'
            send_resolved: true

      - name: 'platform-receiver'
        # Platform team notifications
        # slack_configs:
        #   - channel: '#platform-alerts'
        #     send_resolved: true
        webhook_configs:
          - url: 'http://alertmanager-webhook.observability.svc.cluster.local:8080/platform'
            send_resolved: true

    # Templates
    templates: []
